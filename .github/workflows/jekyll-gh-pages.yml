<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXX — License Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b;
    --bg-glow: radial-gradient(60% 40% at 50% -10%, rgba(224,169,76,0.18), transparent 70%);
    --panel:#131318;
    --panel-border: rgba(255,255,255,0.11);
    --amber:#eab35a;
    --amber-soft: rgba(234,179,90,0.14);
    --mint:#4ee0a0;
    --text:#f7f6f2;
    --text-dim:#a5a3ac;
    --text-faint:#6b6971;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg-glow), var(--bg);
    color:var(--text);
    font-family: var(--display);
    -webkit-font-smoothing:antialiased;
    padding: 0 0 80px;
  }
  .wrap{ max-width: 1040px; margin: 0 auto; padding: 48px 20px 0; }

  .top-banner{
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: linear-gradient(90deg, #1a1408, #16130a 50%, #1a1408);
    border-bottom:1px solid rgba(234,179,90,0.25);
    padding:11px 16px; text-align:center;
    font-family:var(--mono); font-size:0.78rem; font-weight:600; letter-spacing:0.02em;
    color:var(--amber); flex-wrap:wrap;
  }
  .top-banner strong{ color:var(--text); font-weight:700; }
  .top-banner .sep{ color:var(--text-faint); }

  /* Header */
  .brand{ display:flex; align-items:center; gap:14px; margin-bottom: 46px; }
  .join-tg{
    margin-left:auto; display:flex; align-items:center; gap:7px;
    text-decoration:none; color:var(--text-dim);
    font-family:var(--mono); font-size:0.78rem; font-weight:500;
    padding:9px 14px; border-radius:9px; border:1px solid var(--panel-border);
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .join-tg svg{ width:14px; height:14px; }
  .join-tg:hover{ color:var(--amber); border-color:rgba(224,169,76,0.35); }
  @media (max-width:520px){ .brand{ flex-wrap:wrap; } .join-tg{ margin-left:56px; } }
  .brand-mark{
    width:42px;height:42px;border-radius:11px;
    background: linear-gradient(155deg, #e0a94c, #b9812c);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 0 4px 18px rgba(224,169,76,0.25);
    flex-shrink:0;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-name{ font-weight:700; font-size:1.15rem; letter-spacing:0.02em; }
  .brand-sub{ color:var(--text-dim); font-size:0.82rem; font-family:var(--mono); letter-spacing:0.03em; }

  .apk-banner{
    display:flex; align-items:center; gap:10px;
    background: linear-gradient(90deg, rgba(224,169,76,0.14), rgba(224,169,76,0.05));
    border:1px solid rgba(224,169,76,0.3);
    border-radius:12px; padding:13px 18px; margin-bottom:32px;
    text-decoration:none; color:var(--amber);
    font-family:var(--mono); font-size:0.84rem; font-weight:600;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .apk-banner svg{ width:16px; height:16px; flex-shrink:0; }
  .apk-banner .apk-arrow{ margin-left:auto; transition: transform 0.15s ease; }
  .apk-banner:hover{ border-color: rgba(224,169,76,0.55); background: linear-gradient(90deg, rgba(224,169,76,0.2), rgba(224,169,76,0.07)); }
  .apk-banner:hover .apk-arrow{ transform: translateX(3px); }
  @media (max-width:520px){ .apk-banner span:not(.apk-arrow){ font-size:0.78rem; } }

  .hero{ margin-bottom: 52px; }
  .eyebrow{
    font-family: var(--mono); font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--amber); margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint); }
  h1{ font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight:700; margin:0 0 12px; letter-spacing:-0.01em; line-height:1.15; }
  .hero p{ color:var(--text-dim); font-size:1rem; max-width:520px; line-height:1.55; margin:0; }

  /* Pricing grid */
  .grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap:18px;
  }
  @media (max-width: 1000px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background: linear-gradient(180deg, #16161d, var(--panel));
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding: 28px 24px 24px;
    position:relative;
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 20px 40px -24px rgba(0,0,0,0.6);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .card:hover{ border-color: rgba(255,255,255,0.14); transform: translateY(-2px); }
  .card.featured{
    border-color: rgba(224,169,76,0.45);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 24px 48px -20px rgba(224,169,76,0.18);
  }
  .card.featured:hover{ border-color: rgba(224,169,76,0.7); }
  .card.featured::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  .card.reseller{
    border-color: rgba(62,207,142,0.4);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 24px 48px -20px rgba(62,207,142,0.16);
  }
  .card.reseller:hover{ border-color: rgba(62,207,142,0.65); }
  .card.reseller::before{
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--mint), transparent);
  }
  .card.reseller .price-primary{ color: var(--mint); font-size:1.3rem; }
  .card.reseller .tier-tag{ color: var(--mint); }
  .card.reseller .buy-btn{
    background: rgba(62,207,142,0.12); color: var(--mint);
    border-color: rgba(62,207,142,0.35);
  }
  .card.reseller .price-list li::before{ content:'✓'; color:var(--mint); font-weight:600; margin-right:8px; }
  .card.reseller .price-list .place{ gap:0; }

  @media (prefers-reduced-motion: reduce){ .card{ transition:none; } .card:hover{ transform:none; } }
  .tier-tag{
    font-family:var(--mono); font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:10px;
  }
  .tier-name{ font-size:1.3rem; font-weight:700; margin-bottom:4px; }
  .tier-desc{ color:var(--text-dim); font-size:0.85rem; margin-bottom:22px; }

  .price-primary{
    font-family: var(--mono); font-weight:700; font-size:2.1rem; line-height:1;
    color:var(--text); margin-bottom:2px;
  }
  .price-primary .cur{ font-size:1.05rem; color:var(--amber); margin-right:4px; vertical-align:2px; }
  .price-primary-label{
    font-family:var(--mono); font-size:0.72rem; color:var(--text-faint); margin-bottom:20px; letter-spacing:0.03em;
  }

  .divider-label{
    font-family:var(--mono); font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); border-top:1px solid var(--panel-border); padding-top:16px; margin-bottom:12px;
  }
  .price-list{ list-style:none; margin:0 0 24px; padding:0; display:flex; flex-direction:column; gap:9px; flex-grow:1; }
  .price-list li{
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--mono); font-size:0.86rem; color:var(--text-dim);
  }
  .price-list .place{ display:flex; align-items:center; gap:8px; }
  .price-list .flag{ font-size:1rem; }
  .price-list .val{ color:var(--text); font-weight:500; }
  .price-list .code{ color:var(--text-faint); font-size:0.72rem; margin-left:4px; }

  .buy-row{ display:flex; gap:8px; }
  .buy-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    text-align:center; text-decoration:none;
    background: var(--amber-soft); color:var(--amber);
    border:1px solid rgba(224,169,76,0.35);
    font-family:var(--mono); font-weight:600; font-size:0.82rem;
    padding:12px 8px; border-radius:10px;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .card.featured .buy-btn{
    background: var(--amber); color:#1a1206; border-color:transparent;
    box-shadow: 0 6px 16px -6px rgba(224,169,76,0.5);
  }
  .buy-btn:hover{ transform: translateY(-1px); }
  .buy-btn:focus-visible{ outline:2px solid var(--mint); outline-offset:2px; }
  .buy-btn svg{ width:14px; height:14px; flex-shrink:0; }

  .note{
    margin-top:36px; padding:16px 18px; border-radius:12px;
    background: rgba(255,255,255,0.025); border:1px solid var(--panel-border);
    color:var(--text-faint); font-size:0.8rem; line-height:1.6; font-family:var(--mono);
  }
  .note strong{ color:var(--text-dim); }

  .trust{
    margin-top:20px; padding:26px 28px; border-radius:16px;
    background: linear-gradient(180deg, #16161d, var(--panel));
    border:1px solid var(--panel-border);
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
  }
  .trust-title{
    font-family:var(--mono); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--mint); margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .trust-title::before{ content:'✓'; }
  .trust p{ color:var(--text-dim); font-size:0.88rem; line-height:1.7; margin:0; }

  .footer{
    text-align:center; margin-top:44px; padding-top:28px;
    border-top:1px solid var(--panel-border);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .footer-mark{ display:flex; align-items:center; gap:7px; opacity:0.6; }
  .footer-mark svg{ width:14px; height:14px; }
  .footer-mark span{ font-family:var(--mono); font-size:0.78rem; letter-spacing:0.1em; color:var(--text-dim); }
  .footer-status{
    font-family:var(--mono); font-size:0.72rem; color:var(--text-faint);
    display:flex; align-items:center; gap:7px;
  }
  .footer-status .dot{
    width:6px;height:6px;border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint);
  }
  .footer-legal{ font-family:var(--mono); font-size:0.7rem; color:var(--text-faint); letter-spacing:0.02em; }

  @media (prefers-reduced-motion: reduce){ .buy-btn{ transition:none; } }
</style>
</head>
